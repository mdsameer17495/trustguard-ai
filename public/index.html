<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TrustGuard AI</title>

<style>

:root[data-theme=dark]{--bg:#0f1a1c;--card:#17262a;--ink:#e6eeee;--mute:#9db0b3;--pri:#6fcdbd;--onpri:#08201c;--soft:#1d3a38;--line:#2a3d41;--hi:#ff8f84;--mid:#ffb74d;--lo:#86cb8a;--himk:#4a2320;--midmk:#4a3a14}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:1.0625rem/1.65 Hind,system-ui,sans-serif}
h1,h2,h3{font-family:Bitter,Georgia,serif;line-height:1.2;margin:0 0 .5em}h1{font-size:2rem}h2{font-size:1.4rem}h3{font-size:1.1rem;margin-top:1.4em}
a{color:var(--pri)}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;font:700 1.15rem Bitter,serif;text-decoration:none;color:var(--ink);padding:4px 8px 16px}

main{padding:28px clamp(16px,4vw,48px) 60px;max-width:980px;width:100%}
.lead{color:var(--mute);max-width:60ch}
textarea,input[type=text],select{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{resize:vertical}
.btn{font:600 1rem Hind,sans-serif;background:var(--pri);color:var(--onpri);border:0;border-radius:8px;padding:12px 20px;min-height:48px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rb{display:inline-block;font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:4px;letter-spacing:.02em}
.rb.HIGH{background:var(--himk);color:var(--hi)}.rb.MEDIUM{background:var(--midmk);color:var(--mid)}.rb.LOW{background:var(--soft);color:var(--lo)}
.rhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.rhead h2{margin:0}
.res{border-left:5px solid var(--pri);padding-left:18px;margin-top:22px}
.signs{list-style:none;padding:0;margin:0}.signs li{padding:8px 0;border-bottom:1px solid var(--line)}.signs b{display:block}.signs span{color:var(--mute);font-size:.95rem}
.acts{padding-left:20px}.hl{background:var(--bg);padding:12px 14px;border-radius:8px;white-space:pre-wrap}
mark{background:var(--himk);color:inherit;border-bottom:2px solid var(--hi);padding:0 2px;border-radius:2px}
.hin{color:var(--mute);border-left:3px solid var(--line);padding-left:10px}
.err{background:var(--himk);color:var(--ink);border-radius:8px;padding:12px 14px}
.load{display:flex;gap:6px;align-items:center;padding:20px 0;color:var(--mute)}.load i{width:10px;height:10px;border-radius:50%;background:var(--pri);animation:b 1s infinite}.load i:nth-child(2){animation-delay:.15s}.load i:nth-child(3){animation-delay:.3s}.load span{margin-left:8px}

.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}

.top{display:none;justify-content:space-between;align-items:center;padding:14px clamp(16px,4vw,48px)}
body.home .top{display:flex}body.home aside,body.home .bn{display:none}body.home .shell{display:block}body.home main{max-width:1060px;margin:0 auto}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding:20px 0 30px}.hero h1{font-size:clamp(2.2rem,5vw,3.4rem)}
.paper{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 2px;padding:18px;box-shadow:4px 4px 0 var(--soft)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding:4px}.m{padding:10px 14px;border-radius:14px;max-width:86%}.m.u{align-self:flex-end;background:var(--pri);color:var(--onpri)}.m.a{background:var(--card);border:1px solid var(--line)}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--pri);color:var(--onpri);font:600 .95rem Hind;cursor:pointer}.mic.on{animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 14px var(--soft)}}
.ring{position:relative;width:150px;height:150px}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 2rem Bitter}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;font:inherit;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;cursor:pointer}.opt.ok{border-color:var(--lo);background:var(--soft)}.opt.no{border-color:var(--hi);background:var(--himk)}
details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:600}
.small{font-size:.88rem;color:var(--mute)}.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line)}
.bn{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:5}
.bn a{flex:1;text-align:center;padding:8px 2px;text-decoration:none;color:var(--mute);font-size:.8rem;font-weight:600;min-height:48px}.bn a.on{color:var(--pri)}
@media(max-width:820px){.shell{display:block}aside{position:fixed;inset:0 25% 0 0;z-index:9;transform:translateX(-105%);transition:transform .2s}aside.open{transform:none;box-shadow:6px 0 30px #0005}.bn{display:flex}main{padding-bottom:100px}.hero,.cols,.feat{grid-template-columns:1fr}.brow{grid-template-columns:1fr 44px}.brow span:first-child{grid-column:1/3}h1{font-size:1.65rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st={get(k,d){try{const v=localStorage.getItem('tg_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('tg_'+k,JSON.stringify(v))}catch(e){}}};
const N=[['dash','Dashboard'],['scan','Scam Scanner'],['shot','Screenshot Analyzer'],['content','Content Checker'],['url','URL Checker'],['bot','TrustGuard Assistant'],['fin','Finance Simplifier'],['rights','Investor Rights'],['lib','Scam Library'],['quiz','Safety Quiz'],['hist','History'],['set','Settings'],['about','About & Privacy']];
const SL={aw:'Scam awareness',ds:'Digital safety',cv:'Content verification',pa:'Privacy awareness',ir:'Investor rights'};
let S=st.get('score',{aw:85,ds:72,cv:80,pa:75,ir:78}),cfg=st.get('cfg',{lang:'hn',big:false,speak:false});
const total=()=>Math.round(Object.values(S).reduce((a,b)=>a+b,0)/5);
const now=Date.now();let H=st.get('hist',[{type:'Scam Scanner',txt:'Guaranteed 25% monthly returns, join VIP group…',risk:'HIGH',t:now-864e5},{type:'URL Checker',txt:'sebi-kyc-update.xyz/login',risk:'HIGH',t:now-1728e5},{type:'Content Checker',txt:'Reel: "Is stock se double paisa"',risk:'MEDIUM',t:now-2592e5}]);
const addH=(type,txt,risk)=>{H.unshift({type,txt:txt.trim().slice(0,90),risk,t:Date.now()});H=H.slice(0,40);st.set('hist',H)};
const when=t=>new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const DID=(()=>{let d=st.get('did');if(!d){d=crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now();st.set('did',d)}return d})();
async function api(p,b,m='POST'){try{const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json','X-Device-Id':DID},body:b?JSON.stringify(b):undefined});return r.ok?await r.json():null}catch(e){return null}}
const DEMO="Congratulations! You have been selected for an exclusive investment opportunity. Invest ₹10,000 today and receive guaranteed monthly returns of 40%. Limited slots available. Complete your KYC using the link below.";
/* ---- analysis engine: input -> detect -> explain -> guide ---- */
const R=[[/guarantee[d]?|assured returns?|risk[- ]?free|pakka|sure[- ]shot/gi,'Guaranteed returns','Real investments carry risk. No honest source can promise a fixed profit.'],
[/\b([3-9]\d|\d{3})\s?%/g,'Unrealistic returns','Returns this high, especially monthly, are far outside what regulated products offer.'],
[/\b(today|immediately|urgent(ly)?|hurry|last chance|expires?|abhi|turant|aaj hi|within \d+ (hours?|minutes?))\b/gi,'Urgency','Pressure to act fast is meant to stop you from checking.'],
[/limited (slots?|seats?|period|offer)|only \d+ (slots?|seats?|left)|few (slots|seats)/gi,'Limited-slot pressure','Fake scarcity pushes people to decide before they verify.'],
[/\bkyc\b|account (will be )?(blocked|suspended)|update (your )?(pan|aadhaar)/gi,'KYC or account-block pressure','Genuine KYC is done in the official app or branch, not through a forwarded message.'],
[/(https?:\/\/|www\.)\S+|\b(bit\.ly|t\.me|wa\.me|tinyurl\.com)\S*|\b(using|click|tap|open)\s+(the\s+|this\s+)?(link|url)( below| here)?/gi,'External link','Links in unsolicited messages can lead to look-alike pages that steal details.'],
[/\b(otp|upi pin|password|cvv)\b/gi,'Mentions OTP, PIN or password','Banks and regulators never ask you for these.'],
[/(invest|deposit|transfer|pay|send)\s+(₹|rs\.?|inr)?\s?[\d,]{3,}/gi,'Asks for money upfront','Being asked to pay first, before anything is verified, is a common pattern.'],
[/(vip|premium) (group|channel)|join (my|our) (telegram|whatsapp)|telegram channel/gi,'Pushes you into private groups','Private groups are hard to monitor and are often used to build false hype.'],
[/congratulations|you (have been|are) selected|you('ve| have) won/gi,'Unsolicited "you are selected" hook','Real opportunities rarely arrive as a surprise prize.']];
const HIN={HIGH:'इस संदेश में कई चेतावनी संकेत हैं। पैसे न भेजें, OTP/PIN किसी को न बताएं, पहले आधिकारिक स्रोत से जाँच करें।',MEDIUM:'इसमें कुछ चेतावनी संकेत हैं। कोई भी कदम उठाने से पहले भेजने वाले की आधिकारिक स्रोत से पुष्टि करें।',LOW:'कोई आम चेतावनी संकेत नहीं मिला, फिर भी पैसे या निजी जानकारी देने से पहले जाँच ज़रूर करें।'};
const ACT=['Do not transfer money immediately.','Do not share OTP, PIN or password with anyone.','Verify the organization through official sources.','Avoid tapping suspicious links.','If you already paid, call 1930 or report at cybercrime.gov.in.'];
function analyze(t){const hits=[],seen=new Map();
R.forEach(([re,l,w])=>{re.lastIndex=0;let m;while((m=re.exec(t))){hits.push([m.index,m.index+m[0].length,l]);seen.set(l,w);if(!m[0])re.lastIndex++}});
hits.sort((a,b)=>a[0]-b[0]);let p=0,hl='';hits.forEach(([s,e,l])=>{if(s<p)return;hl+=esc(t.slice(p,s))+`<mark title="${esc(l)}">${esc(t.slice(s,e))}</mark>`;p=e});hl+=esc(t.slice(p));
const signs=[...seen.keys()],n=signs.length,risk=n>=4?'HIGH':n>=2?'MEDIUM':'LOW';
const exp=n?`This message contains ${n} warning sign${n>1?'s':''} commonly associated with financial scams: ${signs.join(', ').toLowerCase()}. That does not prove who sent it, but it is enough reason to slow down and verify before acting.`:'We did not find the usual warning signs. That is not a guarantee of safety. If money or personal details are involved, verify the sender through an official source.';
return{risk,signs,why:[...seen],hl,exp,hi:HIN[risk]}}
const badge=r=>`<span class="rb ${r}">${r}</span>`;
const resHTML=a=>`<section class="res"><div class="rhead">${badge(a.risk)}<h2>Risk level: ${a.risk}</h2></div><p class="hl" aria-label="Message with highlights">${a.hl}</p>
<h3>Warning signs detected</h3>${a.why.length?`<ul class="signs">${a.why.map(([l,w])=>`<li><b>${l}</b><span>${w}</span></li>`).join('')}</ul>`:'<p>No common warning signs found.</p>'}
<h3>AI explanation</h3><p>${a.exp}</p><p class="hin">${a.hi}</p><h3>Safe actions</h3><ul class="acts">${ACT.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;
function runA(out,type,text,render){if(!text.trim()){out.innerHTML='<p class="err">Pehle kuch text paste karein. There is nothing to analyze yet.</p>';return}
out.innerHTML='<div class="load" role="status"><i></i><i></i><i></i><span>Reading the text and looking for warning signs…</span></div>';
(async()=>{try{const a=analyze(text),r=await api('/api/analyze',{text,type});if(r&&r.risk_level){a.risk=r.risk_level;if(r.warning_signs&&r.warning_signs.length)a.why=r.warning_signs.map(w=>[w.label,w.why]);a.exp=r.explanation||a.exp;a.hi=r.explanation_hi||a.hi}out.innerHTML=render(a,text);addH(type,text,a.risk)}catch(e){out.innerHTML='<div class="err">We couldn\'t complete the analysis right now. Please try again. <button class="btn ghost" id="rt">Retry</button></div>';$('#rt').onclick=()=>runA(out,type,text,render)}})()}
/* ---- content ---- */
const LIB=[['Investment','Guaranteed-return schemes','A scheme that promises fixed, high profit with little or no risk.','Early members are paid from new members\' money, so it looks real until recruits dry up (Ponzi-style).','Fixed monthly return|Pressure to bring friends|No registration number|Withdrawals get delayed','"Put in ₹50,000, get ₹10,000 every month, guaranteed."','Ask for the SEBI registration number and check it on sebi.gov.in. If returns sound too good, walk away.'],
['Investment','Fake investment apps','Apps that show fake profits on screen but are not connected to any real market.','You are asked to download an APK from a link, deposit money, see a rising balance, then fees appear when you try to withdraw.','App not on the official store|"Withdrawal tax" demanded|A "mentor" guides you on WhatsApp','A "trading app" shows ₹80,000 profit but asks for ₹15,000 to release it.','Use only apps from your broker or bank\'s official page. Never install apps from chat links.'],
['Digital','Phishing','Messages or pages that copy a real bank or regulator to steal your details.','A link opens a near-identical page and asks you to log in or enter card details.','Slight spelling changes in names|Account-blocked threats|Login asked after clicking a link','SMS: "Your account is blocked, update KYC at sbi-kyc-help.top".','Type the official address yourself. Check any link in the URL Checker first.'],
['Digital','OTP and payment scams','Tricking you into sharing an OTP, UPI PIN or approving a collect request.','The caller creates panic, then asks for the code "to stop" or "to refund" a payment.','Caller asks for OTP|"Enter PIN to receive money"|Collect request you did not expect','"Sir, a refund is stuck. Share the OTP so I can release it."','You never need a PIN to receive money. Hang up and call your bank\'s number from your card.'],
['Digital','Fake customer support','Fraudulent helpline numbers that appear in search results or social posts.','You search for a helpline, call a fake number, and they guide you to share screen or codes.','Number from a random post|Asks for screen sharing|Asks you to install a remote app','A "bank helpline" that asks you to install a screen-sharing app.','Take helpline numbers only from the official website, app or the back of your card.'],
['Social media','Fake investment influencers','Profiles that show profit screenshots and push you into private groups or paid tips.','Screenshots are edited, testimonials are bought, and "VIP" fees keep rising.','Profit screenshots only|Pushes a private group|Hides registration details','Reel: "I turned ₹5,000 into ₹2 lakh. DM for the group".','Check whether the person is a SEBI-registered adviser. Treat screenshots as claims, not proof.']];
const FIN={SIP:['A way to invest a fixed amount at regular intervals, like every month, in a mutual fund.','SIP मतलब हर महीने तय रकम किसी म्यूचुअल फंड में डालना।','Like a monthly recurring deposit, but the value can go up or down.'],
'Mutual Fund':['A pool of money from many people, managed by professionals, invested in different assets.','म्यूचुअल फंड में कई लोगों का पैसा इकट्ठा होता है और विशेषज्ञ उसे अलग-अलग जगह लगाते हैं।','Like a group buying groceries together, each person gets a share of what is bought.'],
KYC:['"Know Your Customer": a one-time identity check before opening a financial account.','KYC यानी खाता खोलने से पहले आपकी पहचान की जाँच।','Like showing your ID at a new school. Do it only through the official app or branch.'],
Nominee:['A person you name to receive or handle your account assets, as per the applicable process, after your death.','Nominee वह व्यक्ति है जिसे आप अपने खाते की संपत्ति के लिए नामित करते हैं।','You name your daughter as nominee so the account does not get stuck in her time of need.'],
'Demat Account':['An account that holds shares and securities in electronic form instead of paper.','डीमैट खाता शेयरों को कागज़ की जगह इलेक्ट्रॉनिक रूप में रखता है।','Like a bank account, but for shares instead of cash.'],
SEBI:['The Securities and Exchange Board of India, the regulator of the securities market.','SEBI भारत में प्रतिभूति बाज़ार का नियामक है।','Like a referee in a match who makes sure players follow the rules.'],
Grievance:['A formal complaint about a service or a problem you faced.','Grievance यानी किसी सेवा या समस्या के बारे में औपचारिक शिकायत।','Your broker did not process your request, so you raise a complaint through the proper channel.'],
Diversification:['Spreading money across different kinds of assets so one bad outcome hurts less.','डायवर्सिफिकेशन यानी पैसा अलग-अलग जगह बाँटना ताकि एक जगह का नुकसान कम पड़े।','Not keeping all eggs in one basket.'],
Phishing:['A trick where a fake message or page copies a real one to steal your details.','फ़िशिंग में नकली मैसेज या पेज असली जैसा बनकर आपकी जानकारी चुराता है।','An SMS that looks like your bank but links to a copy of its login page.'],
Risk:['The chance that the outcome is different from what you expected, including losing money.','रिस्क यानी उम्मीद से अलग नतीजा आने की संभावना, जिसमें नुकसान भी शामिल है।','Any investment can lose value. A promise of zero risk is a warning sign.']};
const BR=[[/guarantee|assured|pakka|गारंटी/i,'g'],[/otp|pin|password|ओटीपी/i,'o'],[/kyc|केवाईसी/i,'k'],[/link|url|website|लिंक/i,'l'],[/complain|shikayat|grievance|शिकायत|fraud|dhokha|ठगी|paise chale/i,'c']];
const BT={g:{en:'A guaranteed return can be a warning sign. Real investments carry risk. Before you transfer money or share an OTP, verify the organization through an official source.',hi:'गारंटीड रिटर्न एक चेतावनी संकेत हो सकता है। पैसे भेजने या OTP बताने से पहले संस्था को आधिकारिक स्रोत से जाँचें।',hn:'Guaranteed returns ek warning sign ho sakta hai. Paise transfer karne ya OTP share karne se pehle organization ko official source se verify karein.'},
o:{en:'Never share your OTP, UPI PIN or password with anyone, even someone who says they are from your bank or SEBI. Hang up and call the number printed on your bank card.',hi:'OTP, UPI PIN या पासवर्ड किसी को न बताएं, चाहे वह बैंक या SEBI का नाम ले। कॉल काटें और कार्ड पर छपे नंबर पर खुद फ़ोन करें।',hn:'OTP, UPI PIN ya password kisi ko na batayein, chahe woh bank ya SEBI ka naam le. Call kaat dein aur card par chhape number par khud phone karein.'},
k:{en:'KYC updates are done through your bank or broker\'s official app or branch. Do not complete KYC through a link sent on WhatsApp or SMS.',hi:'KYC अपडेट बैंक या ब्रोकर के आधिकारिक ऐप या शाखा से होता है। WhatsApp या SMS के लिंक से KYC न करें।',hn:'KYC update bank ya broker ke official app ya branch se hota hai. WhatsApp ya SMS ke link se KYC na karein.'},
l:{en:'Do not tap unknown links. Type the official website address yourself, or run it through the URL Checker first. It shows warning signs, not a final verdict.',hi:'अनजान लिंक पर टैप न करें। आधिकारिक वेबसाइट का पता खुद टाइप करें, या पहले URL Checker में जाँचें।',hn:'Unknown link par tap na karein. Official website ka address khud type karein, ya pehle URL Checker mein check karein.'},
c:{en:'If you lost money, call 1930 or report at cybercrime.gov.in quickly. For a SEBI-registered intermediary, the SCORES portal is the official route. See Investor Rights.',hi:'अगर पैसे चले गए हैं तो तुरंत 1930 पर कॉल करें या cybercrime.gov.in पर रिपोर्ट करें। SEBI-पंजीकृत संस्था के लिए SCORES पोर्टल आधिकारिक रास्ता है।',hn:'Agar paise chale gaye hain to turant 1930 par call karein ya cybercrime.gov.in par report karein. SEBI-registered sanstha ke liye SCORES portal official raasta hai.'},
d:{en:'I can help with scam warning signs, OTP safety, KYC and links. Try: "I got a message promising guaranteed returns. What should I do?" I do not give investment advice.',hi:'मैं स्कैम के चेतावनी संकेत, OTP सुरक्षा, KYC और लिंक पर मदद कर सकता हूँ। पूछें: "गारंटीड रिटर्न वाला मैसेज आया है, क्या करूँ?" मैं निवेश सलाह नहीं देता।',hn:'Main scam warning signs, OTP safety, KYC aur links mein madad kar sakta hoon. Poochhiye: "Guaranteed return wala message aaya hai, kya karun?" Main investment advice nahi deta.'}};
const QZ=[['aw','Someone promises guaranteed 30% monthly returns and asks you to transfer money immediately. What should you do?',['Invest immediately','Share OTP','Verify the claim through official sources','Send money to reserve the opportunity'],2,'Guaranteed, very high returns plus pressure to pay quickly are classic warning signs. Pause and verify first.'],
['ds','A caller says they are from your bank and needs your OTP to "update KYC". You…',['Share it quickly','Hang up and call the number on your bank card','Share only the first 3 digits','Ask them to send a link'],1,'Banks never ask for OTPs. Calling back on a number you trust breaks the scammer\'s control of the conversation.'],
['cv','An Instagram reel shows profit screenshots and says "join my VIP Telegram group". Best first step?',['Join and see','Check if the person is a SEBI-registered adviser','Send a small amount to test','Forward it to friends'],1,'Screenshots are easy to fake. Registration status can be checked on SEBI\'s official site.'],
['ir','Where should you file an online complaint against a SEBI-registered intermediary?',['A site that says "recover your money for a fee"','SEBI SCORES portal (scores.sebi.gov.in)','A WhatsApp number from an ad','A Telegram recovery agent'],1,'Use the official SCORES portal. Services that promise to recover lost money for a fee are often scams themselves.'],
['pa','A "helper" on WhatsApp wants your PAN photo and UPI PIN to "activate your account". What is right?',['Send both','Send PAN only','Share neither and verify who they are first','Send the PIN only'],2,'A UPI PIN is never needed to activate anything. Share documents only through verified, official channels.']];
let qs={i:0,ans:[],done:false};

const P={};
P.home={h:()=>{const a=analyze(DEMO);return`<section class="hero"><div><h1>Verify Before You Trust.</h1><p class="lead">AI-powered protection against financial scams, misleading content, and digital financial threats. Made for first-time investors, families, and anyone who gets "forwards".</p><div class="row"><a class="btn" href="#/scan">Scan a Message</a><a class="btn ghost" href="#/bot">Ask TrustGuard</a></div></div>
<div class="paper"><p class="small" style="margin-top:0">A message like this arrived on WhatsApp. We marked what looks suspicious:</p><p class="hl">${a.hl}</p><p style="margin:10px 0 0">${badge(a.risk)} <span class="small">${a.signs.length} warning signs, tap Scan to see why</span></p></div></section>
<h2>What it checks</h2><div class="feat">${[['scan','AI scam detection','Paste a message, get warning signs in plain words.'],['shot','Screenshot analysis','Upload a chat screenshot, we read the text first.'],['content','Content verification','Reels, posts and ads: what is claimed, what is missing.'],['url','URL safety check','Spot look-alike and risky web addresses.'],['bot','Voice assistant','Ask in Hindi, Hinglish or English. It talks back.'],['fin','Financial education','SIP, KYC, nominee and more, in simple language.']].map(([k,t,d])=>`<a href="#/${k}"><b>${t}</b><span>${d}</span></a>`).join('')}</div>
<h2 style="margin-top:36px">Why TrustGuard AI?</h2><div class="cols"><ul><li>Detects suspicious patterns</li><li>Helps you understand financial claims</li><li>Teaches financial safety</li></ul><ul><li>Explains in simple Hindi and English</li><li>Works well on a basic phone</li><li>Privacy first: no OTPs, no PINs, no stored screenshots</li></ul></div>
<p class="foot small">TrustGuard AI provides educational and safety information. It does not provide investment advice, stock recommendations, price predictions, or financial guarantees. Detect, explain, verify, protect.</p>`}};
P.dash={h:()=>{const t=total(),rd=st.get('read',[]).length,q=st.get('lastq',null),hi=H.filter(x=>x.risk==='HIGH').length;return`<h1>Safety overview</h1><div class="panel row" style="align-items:center;gap:28px"><div class="ring"><svg viewBox="0 0 36 36" width="150" height="150" style="transform:rotate(-90deg)"><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--soft)" stroke-width="3.2"/><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--pri)" stroke-width="3.2" stroke-dasharray="${t} 100" stroke-linecap="round"/></svg><b>${t}<small style="font:.9rem Hind">/100</small></b></div><div style="flex:1;min-width:230px"><h2>Financial Safety Awareness Score</h2>${Object.entries(S).map(([k,v])=>`<div class="brow"><span>${SL[k]}</span><div class="bar"><i style="width:${v}%"></i></div><span>${v}%</span></div>`).join('')}<p class="small">This score measures safety awareness, not investment performance or financial suitability.</p></div></div>
<div class="cols"><div class="panel"><h3 style="margin-top:0">Recent scans</h3>${H.slice(0,4).map(x=>`<p style="margin:6px 0">${badge(x.risk)} ${esc(x.txt)}<br><span class="small">${x.type}, ${when(x.t)}</span></p>`).join('')||'<p>No scans yet. <a href="#/scan">Scan your first message</a>.</p>'}</div>
<div class="panel"><h3 style="margin-top:0">Recent warnings</h3><p>${hi} high-risk result${hi===1?'':'s'} in your history.</p><h3>Learning progress</h3><div class="bar"><i style="width:${rd/LIB.length*100}%"></i></div><p class="small">${rd} of ${LIB.length} scam guides read</p><h3>Quiz progress</h3><p>${q?`Last score ${q}/5`:'Not taken yet'} <a href="#/quiz">${q?'Retake':'Start'} the quiz</a></p></div></div>`}};
P.scan={h:()=>`<h1>Scam Scanner</h1><p class="lead">Paste a WhatsApp, SMS, email, Telegram message or an investment ad.</p><textarea id="tx" rows="6" placeholder="Paste the message here" aria-label="Message to analyze"></textarea><div class="row"><button class="btn" id="go">Analyze with AI</button><button class="btn ghost" id="demo">Try the demo message</button></div><div id="out" aria-live="polite"></div>`,i:()=>{$('#demo').onclick=()=>{$('#tx').value=DEMO;$('#go').click()};$('#go').onclick=()=>runA($('#out'),'Scam Scanner',$('#tx').value,resHTML)}};
P.shot={h:()=>`<h1>Screenshot Analyzer</h1><p class="lead">Upload a screenshot. We read the text, then check it for warning signs.</p><input type="file" id="f" accept="image/png,image/jpeg,image/webp" class="btn ghost" aria-label="Upload screenshot"><div id="pv"></div><div id="out" aria-live="polite"></div>`,i:()=>{let url;const f=$('#f'),out=$('#out');f.onchange=()=>{const x=f.files[0];if(!x)return;if(!/^image\/(png|jpeg|webp)$/.test(x.type)){out.innerHTML='<p class="err">Unsupported file. Please upload a PNG, JPG or WebP screenshot.</p>';return}
if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(x);$('#pv').innerHTML=`<div class="panel"><img src="${url}" alt="Uploaded screenshot" style="max-width:100%;max-height:320px;border-radius:8px"><div class="row"><button class="btn" id="ocr">Extract text and analyze</button><button class="btn ghost" id="clr">Clear analysis</button></div></div>`;out.innerHTML='';
$('#clr').onclick=()=>{URL.revokeObjectURL(url);f.value='';$('#pv').innerHTML='';out.innerHTML=''};
$('#ocr').onclick=async()=>{out.innerHTML='<div class="load" role="status"><i></i><i></i><i></i><span>Step 1 of 2: reading text from the image…</span></div>';let tx=null,note='';try{const fd=new FormData();fd.append('image',x);const r=await fetch('/api/ocr',{method:'POST',headers:{'X-Device-Id':DID},body:fd});if(r.ok)tx=(await r.json()).text}catch(e){}
if(!tx||!tx.trim()){tx=DEMO;note='We could not read text from the image right now, so a sample message is shown.'}
out.innerHTML=`<div class="panel"><h3 style="margin-top:0">Extracted text</h3><p class="small">${note||'Text read from your image. The image was not stored.'}</p><textarea id="et" rows="4">${esc(tx)}</textarea><div class="row"><button class="btn ghost" id="re">Analyze edited text</button></div></div><div id="r2"></div>`;
$('#re').onclick=()=>runA($('#r2'),'Screenshot Analyzer',$('#et').value,resHTML);runA($('#r2'),'Screenshot Analyzer',tx,resHTML)}}}};
P.content={h:()=>`<h1>Content Checker</h1><p class="lead">Paste a caption, reel script, post, article or ad. We separate the claim from the pressure around it.</p><textarea id="tx" rows="6" placeholder="Paste financial content here"></textarea><div class="row"><button class="btn" id="go">Check this content</button><button class="btn ghost" id="demo">Try an example</button></div><div id="out" aria-live="polite"></div>`,i:()=>{const ex='Is stock se mere 5 din mein paise double ho gaye! Guaranteed profit, bas aaj hi VIP Telegram group join karo. Kal tak late ho jayega.';
$('#demo').onclick=()=>{$('#tx').value=ex;$('#go').click()};
$('#go').onclick=()=>runA($('#out'),'Content Checker',$('#tx').value,(a,t)=>{const cl=t.split(/(?<=[.!?।])\s+/).filter(s=>/\d+\s?%|guarantee|double|returns?|profit|pakka|never lose|paise/i.test(s)),m=[];
if(!/sebi|registered|registration|INH\d/i.test(t))m.push('No regulator or registration number is named.');if(!/risk|loss|nuksan|subject to/i.test(t))m.push('No mention of risk or possible losses.');if(!/source|report|audited|since|period|years?/i.test(t))m.push('No source, time period or track record is shown.');
return`<section class="res"><div class="rhead">${badge(a.risk)}<h2>Review: ${a.risk} concern</h2></div><h3>Claim detected</h3>${cl.length?`<ul>${cl.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:'<p>No specific financial claim stood out.</p>'}
<h3>Potential concerns</h3>${a.why.length?`<ul class="signs">${a.why.map(([l,w])=>`<li><b>${l}</b><span>${w}</span></li>`).join('')}</ul>`:'<p>No manipulative patterns found.</p>'}
<h3>Missing context</h3><ul>${m.map(x=>`<li>${x}</li>`).join('')||'<li>Nothing obvious, but check the source yourself.</li>'}</ul>
<h3>Verification guidance</h3><ul><li>Look up the person or firm in the SEBI registered intermediaries list on sebi.gov.in.</li><li>Check the claim on the issuer\'s or regulator\'s official website.</li><li>Ask: who benefits if I act on this today?</li></ul><p class="small">This is a check of claims and wording. It is not investment advice.</p></section>`})}};
P.url={h:()=>`<h1>URL Safety Checker</h1><p class="lead">Enter a website address before you open it or log in.</p><input type="text" id="u" placeholder="e.g. sebi-kyc-update.xyz/login" aria-label="Website address"><div class="row"><button class="btn" id="go">Check this website</button><button class="btn ghost" id="demo">Try an example</button></div><div id="out" aria-live="polite"></div>`,i:()=>{const OFF=['sebi.gov.in','nsdl.com','nsdl.co.in','nseindia.com','bseindia.com'];
const chk=()=>{const out=$('#out');let raw=$('#u').value.trim();if(!raw){out.innerHTML='<p class="err">Enter a website address first.</p>';return}let u;try{u=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw);if(!u.hostname.includes('.'))throw 0}catch(e){out.innerHTML='<p class="err">That does not look like a valid web address. Check for typos and try again.</p>';return}
const h=u.hostname.toLowerCase(),off=OFF.some(d=>h===d||h.endsWith('.'+d)),f=[];
if(!off){if(u.protocol==='http:'||!/^https/i.test(raw)&&/^http:/i.test(raw))f.push('Connection is not encrypted (http)');if(/^\d+\.\d+\.\d+\.\d+$/.test(h))f.push('Address is a raw IP number, not a name');if(u.username)f.push('Contains a hidden "@" login part');if(h.includes('xn--'))f.push('Uses look-alike characters');if((h.match(/-/g)||[]).length>=2)f.push('Many hyphens in the domain');
if(/sebi|nsdl|nse|bse|bank|kyc|refund|upi|invest/.test(h))f.push('Name resembles an official body or service, but the domain is not on our official list');if(/\.(xyz|top|click|icu|live|vip|buzz|shop)$/.test(h))f.push('Domain ending is common on short-lived sites');if(/^(bit\.ly|tinyurl\.com|t\.co|rb\.gy)$/.test(h))f.push('Shortened link hides the real destination');if(h.length>30||h.split('.').length>4)f.push('Unusually long or complicated address');if(/login|otp|kyc|verify|password|pin/i.test(u.pathname+u.search))f.push('Page path suggests it asks for sensitive information')}
const r=off?'LOW':f.length>=4?'HIGH':f.length>=2?'MEDIUM':'LOW';addH('URL Checker',raw,r);
out.innerHTML=`<section class="res"><div class="rhead">${badge(r)}<h2>Potential risk: ${r}</h2></div><p><b>${esc(h)}</b></p><h3>Why?</h3>${off?'<p>This domain is on our short reference list of official sites. Still, make sure the full address matches exactly.</p>':f.length?`<ul>${f.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p>No obvious warning signs in the address itself.</p>'}${off?'':'<p class="hin">We could not verify this website with sufficient confidence. Checks here look only at the address pattern and are not a reputation database.</p>'}<h3>Safe actions</h3><ul><li>Do not enter OTP, PIN or passwords.</li><li>Type the official address yourself or use the official app.</li><li>When unsure, ask the organization through a number from its official site.</li></ul></section>`};
$('#go').onclick=chk;$('#demo').onclick=()=>{$('#u').value='http://sebi-kyc-update.xyz/login/verify-otp';chk()}}};
P.bot={h:()=>`<h1>TrustGuard Assistant</h1><p class="lead">Ask in English, Hindi or Hinglish. Tap the big button and speak, or type below.</p><div class="row"><select id="lg" style="max-width:220px" aria-label="Language"><option value="hn">Hinglish</option><option value="hi">हिन्दी</option><option value="en">English</option></select><label class="small" style="align-self:center"><input type="checkbox" id="sp"> Read answers aloud</label></div><div class="chat panel" id="ch" aria-live="polite"></div><div class="row" style="align-items:center"><button class="mic" id="mic" aria-label="Speak your question">Bolo</button><input type="text" id="q" style="flex:1;min-width:200px" placeholder="Type your question" aria-label="Type your question"><button class="btn" id="snd">Send</button></div><p class="small" id="nt"></p>`,i:()=>{const ch=$('#ch'),lg=$('#lg'),sp=$('#sp');lg.value=cfg.lang;sp.checked=cfg.speak;let log=st.get('chat',[]);
const draw=()=>{ch.innerHTML=log.length?log.map(([r,t])=>`<div class="m ${r}">${esc(t)}</div>`).join(''):'<p class="small">Try: "Mujhe WhatsApp pe ek investment ka message aaya hai jisme guaranteed return bola hai. Kya karu?"</p>';ch.scrollTop=1e9};
const say=t=>{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lg.value==='en'?'en-IN':'hi-IN';u.rate=.9;speechSynthesis.speak(u)};
const send=async t=>{t=t.trim();if(!t)return;const k=(BR.find(([re])=>re.test(t))||[0,'d'])[1],r=await api('/api/chat',{message:t,lang:lg.value,history:log.slice(-6)}),a=(r&&r.reply)||BT[k][lg.value];log.push(['u',t],['a',a]);st.set('chat',log.slice(-30));draw();$('#q').value='';if(sp.checked)say(a)};
$('#snd').onclick=()=>send($('#q').value);$('#q').onkeydown=e=>{if(e.key==='Enter')send(e.target.value)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('#mic').onclick=()=>{const nt=$('#nt');if(!SR){nt.textContent='Voice input is not supported in this browser. Please type your question.';return}const r=new SR();r.lang=lg.value==='en'?'en-IN':'hi-IN';r.onresult=e=>send(e.results[0][0].transcript);r.onerror=()=>{nt.textContent='We could not hear you. Check microphone permission and try again.'};r.onend=()=>$('#mic').classList.remove('on');$('#mic').classList.add('on');nt.textContent='';r.start()};draw()}};
P.fin={h:()=>`<h1>Finance Simplifier</h1><p class="lead">Search a term. Get it in simple English, simple Hindi, and a real-life example.</p><input type="text" id="s" list="tl" placeholder="Try KYC" aria-label="Search a financial term"><datalist id="tl">${Object.keys(FIN).map(k=>`<option value="${k}">`).join('')}</datalist><div class="row">${Object.keys(FIN).map(k=>`<button class="btn ghost" data-t="${k}" style="min-height:40px;padding:6px 14px">${k}</button>`).join('')}</div><div id="out" aria-live="polite"></div>`,i:()=>{const show=q=>{const k=Object.keys(FIN).find(x=>x.toLowerCase()===q.trim().toLowerCase())||Object.keys(FIN).find(x=>x.toLowerCase().includes(q.trim().toLowerCase()));$('#out').innerHTML=!q.trim()?'':k?`<section class="res"><h2>${k}</h2><h3>Simple English</h3><p>${FIN[k][0]}</p><h3>Simple Hindi</h3><p>${FIN[k][1]}</p><h3>Real-life example</h3><p>${FIN[k][2]}</p></section>`:'<p class="err">We do not have that term yet. Try one of the buttons above.</p>'};
$('#s').oninput=e=>show(e.target.value);document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{$('#s').value=b.dataset.t;show(b.dataset.t)});$('#s').value='KYC';show('KYC')}};
P.rights={h:()=>`<h1>Investor Rights and Grievances</h1><div class="cols"><div class="panel"><h2>Official information</h2><ul><li>SEBI runs the SCORES portal for complaints against listed companies and SEBI-registered intermediaries: <b>scores.sebi.gov.in</b>.</li><li>National cybercrime helpline: <b>1930</b>. Report online fraud at <b>cybercrime.gov.in</b>.</li><li>Check an adviser or broker's registration on <b>sebi.gov.in</b>.</li></ul><p class="small">Please confirm details on the official websites. Links and numbers can change.</p></div>
<div class="panel"><h2>General guidance</h2><ul><li>Keep screenshots, receipts, transaction IDs and the other party's number.</li><li>First write to the company's grievance officer, then escalate to the regulator if there is no reply.</li><li>Never pay anyone who promises to "recover" your money for a fee.</li><li>Open complaint sites by typing the address yourself. Fake grievance sites copy official logos.</li></ul></div></div><p class="small">TrustGuard does not file complaints on your behalf. It only points you to the right official channel.</p>`};
P.lib={h:()=>`<h1>Scam Library</h1><input type="text" id="s" placeholder="Search, e.g. OTP" aria-label="Search library"><div class="row">${['All','Investment','Digital','Social media'].map(c=>`<button class="btn ghost" data-c="${c}" style="min-height:40px;padding:6px 14px">${c}</button>`).join('')}</div><div id="out"></div>`,i:()=>{let c='All';const rd=new Set(st.get('read',[])),draw=()=>{const q=$('#s').value.toLowerCase();const l=LIB.map((a,i)=>[a,i]).filter(([a])=>(c==='All'||a[0]===c)&&a.join(' ').toLowerCase().includes(q));$('#out').innerHTML=l.map(([a,i])=>`<details data-i="${i}"><summary>${a[1]} <span class="small">(${a[0]})</span></summary><h3>What is it?</h3><p>${a[2]}</p><h3>How does it work?</h3><p>${a[3]}</p><h3>Warning signs</h3><ul>${a[4].split('|').map(x=>`<li>${x}</li>`).join('')}</ul><h3>Example</h3><p><i>${a[5]}</i></p><h3>How to stay safe</h3><p>${a[6]}</p></details>`).join('')||'<p>No guide matches that. Try a shorter word.</p>';
document.querySelectorAll('details').forEach(d=>d.ontoggle=()=>{if(d.open){rd.add(+d.dataset.i);st.set('read',[...rd])}})};
$('#s').oninput=draw;document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{c=b.dataset.c;draw()});draw()}};
P.quiz={h:()=>'<div id="qz"></div>',i:()=>{const el=$('#qz'),draw=()=>{if(qs.done){const ok=qs.ans.filter((a,i)=>a===QZ[i][3]).length,ba=ok===5?'Scam Spotter':ok>=3?'Link Skeptic':'Getting Started';el.innerHTML=`<h1>Quiz complete</h1><div class="panel"><h2>${ok} / 5 correct</h2><p>Badge earned: <b>${ba}</b></p><h3>By topic</h3>${QZ.map((q,i)=>`<div class="brow"><span>${SL[q[0]]}</span><div class="bar"><i style="width:${qs.ans[i]===q[3]?100:0}%"></i></div><span>${qs.ans[i]===q[3]?'✓':'✗'}</span></div>`).join('')}<p>Your awareness score is now <b>${total()}/100</b>.</p><div class="row"><button class="btn" id="rt">Retake quiz</button><a class="btn ghost" href="#/dash">See dashboard</a></div></div>`;$('#rt').onclick=()=>{qs={i:0,ans:[],done:false};draw()};return}
const q=QZ[qs.i],a=qs.ans[qs.i];el.innerHTML=`<h1>Safety Quiz</h1><div class="bar"><i style="width:${qs.i/5*100}%"></i></div><p class="small">Question ${qs.i+1} of 5</p><h2>${q[1]}</h2>${q[2].map((o,j)=>`<button class="opt ${a==null?'':j===q[3]?'ok':j===a?'no':''}" data-j="${j}" ${a==null?'':'disabled'}>${'ABCD'[j]}. ${o}</button>`).join('')}${a==null?'':`<div class="panel"><b>${a===q[3]?'Correct.':'Not quite.'}</b> ${q[4]}</div><button class="btn" id="nx">${qs.i<4?'Next question':'See results'}</button>`}`;

P.about={h:()=>`<h1>About TrustGuard AI</h1><blockquote style="margin:0 0 18px;padding-left:14px;border-left:4px solid var(--pri)">Retail investors, especially first-time and digitally less experienced users, increasingly encounter financial scams, misleading online content, phishing attempts, impersonation, and confusing financial information. These risks can be amplified for users in Tier-2 and Tier-3 cities and for people who prefer regional languages.<br><br>TrustGuard AI addresses this problem by providing an accessible, AI-powered platform for scam signal detection, content analysis, screenshot analysis, financial education, voice assistance, and investor-safety awareness.</blockquote>
<h2>Impact</h2><ul><li><b>Safer digital finance:</b> recognise suspicious patterns before you act.</li><li><b>Financial literacy:</b> hard terms turned into plain language.</li><li><b>Bharat accessibility:</b> Hindi, Hinglish, voice, big buttons, light pages.</li><li><b>Misinformation awareness:</b> see which claims need verification.</li><li><b>Privacy first:</b> no unnecessary financial data collected.</li></ul>
<h2>Privacy and safety</h2><ul><li>We never ask for your OTP, password or UPI PIN.</li><li>We avoid collecting financial details, and do not keep screenshots.</li><li>You can delete everything from Settings at any time.</li><li>Results show warning signs and our confidence, never a final verdict. We may be wrong.</li></ul>
<h2>How the analysis works</h2><p>Input, then text extraction (OCR, speech or URL parsing), then risk-signal detection, then explanation, then safety guidance in simple Hindi or English. The text goes to our Express server, which runs rule-based detection and, when a Gemini key is configured, asks the model for a structured explanation. The AI can raise the risk level but never lower what the rules found. If the AI is unavailable, the rules still answer.</p>
<p class="foot small">TrustGuard AI provides educational and safety information. It does not provide investment advice, stock recommendations, price predictions, or financial guarantees. Built for the SANGYAN Hackathon, SNTC, IIT (BHU) Varanasi.</p>`};
